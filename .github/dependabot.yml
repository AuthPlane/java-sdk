version: 2

updates:
  # Maven reactor (parent pom + all three modules resolved together)
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10
    groups:
      # Only minor + patch updates are bundled. Majors fall out of the
      # group and each gets its own PR so breaking changes are reviewed
      # one at a time.
      maven-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
    groups:
      # Same approach as the maven group: bundle minor + patch, let
      # majors open as individual PRs.
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

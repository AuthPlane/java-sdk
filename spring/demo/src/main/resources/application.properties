# MCP server identity
spring.ai.mcp.server.name=math-mcp-server
spring.ai.mcp.server.version=0.0.1

# Use synchronous, streamable-HTTP transport (WebMVC servlet)
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE

server.port=8080

# Authplane JWT validation
authplane.issuer=${ISSUER_URL:http://localhost:9000}
authplane.resource=${RESOURCE_URL:http://localhost:8080/mcp}
authplane.scopes=tools/add,tools/multiply
authplane.dev-mode=true

# Client credentials — used for introspection (RFC 7662) and token exchange.
# The SDK reads credentials only from an AuthProvider bean; the demo apps register one from the
# CLIENT_ID / CLIENT_SECRET environment variables (see each *Application class).
authplane.introspection.enabled=true

# Advanced (uncomment to customize):
# authplane.circuit-breaker-threshold=5           # Failures before circuit opens
# authplane.circuit-breaker-cooldown-seconds=30   # Cooldown before half-open
# authplane.token-cache-ttl-buffer-seconds=30     # Buffer before token expiry
